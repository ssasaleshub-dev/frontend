<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007aff" />
    <link rel="manifest" href="/manifest.json" />
    <title>SSA CRM</title>
    <meta name="description" content="SSA CRM Platform" />
    <style>
      *, ::before, ::after {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        line-height: 1.45;
        color: #172B4D;
        background-color: #F4F5F7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ssa-initial-splash" style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        padding: 2.5rem 1.5rem;
        padding-top: calc(env(safe-area-inset-top, 0px) + 3rem);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2.5rem);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        box-sizing: border-box;
      ">
        <!-- Top Spacer -->
        <div style="height: 10px;"></div>

        <!-- Center: Clean Brand Logo -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <img
            src="/brand-logo.png"
            onerror="this.onerror=null; this.src='/brand-logo.jpg';"
            alt="SSA"
            style="width: 96px; height: 96px; object-fit: contain; border-radius: 22px;"
          />
        </div>

        <!-- Bottom App Signature -->
        <div style="
          font-size: 13px;
          font-weight: 600;
          color: #9aa0a6;
          letter-spacing: 0.3px;
        ">
          SSA SalesHub CRM
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
