<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#007aff" />
    <link rel="manifest" href="/manifest.json" />
    <title>SSA CRM</title>
    <meta name="description" content="SSA CRM Platform" />
    <style>
      *, ::before, ::after {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        line-height: 1.45;
        color: #172B4D;
        background-color: #F4F5F7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #ssa-initial-splash {
        --size: min(160px, 41.8vw);
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #ffffff;
        overflow: hidden;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        transition: opacity 0.45s ease;
      }
      #ssa-initial-splash.splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #ssa-initial-splash .logo {
        position: relative;
        width: var(--size);
        height: var(--size);
        border-radius: 22.4%;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(2, 110, 62, 0.22);
      }
      #ssa-initial-splash .logo.out {
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #ssa-initial-splash .layer { position: absolute; inset: 0; }
      #ssa-initial-splash .tile { width: 100%; height: 100%; display: block; }
      #ssa-initial-splash .p { position: absolute; opacity: 0; transform-origin: var(--o, 50% 100%); }
      #ssa-initial-splash .sheen {
        position: absolute;
        inset: 0;
        transform: translateX(-120%);
        background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.34) 50%, transparent 60%);
      }
      #ssa-initial-splash .ring {
        position: absolute;
        left: 27.7%;
        top: 51.8%;
        width: 12%;
        height: 12%;
        margin: -6% 0 0 -6%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        opacity: 0;
      }
      #ssa-initial-splash .play { animation: ssaSplashPop 0.95s cubic-bezier(0.34, 1.35, 0.64, 1) both; }
      #ssa-initial-splash .play .fan { animation: ssaSplashFan 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) var(--d) both; }
      #ssa-initial-splash .play .fan2 { animation: ssaSplashFan2 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) var(--d) both; }
      #ssa-initial-splash .play .rise { animation: ssaSplashRise 0.8s cubic-bezier(0.22, 0.9, 0.28, 1.08) var(--d) both; }
      #ssa-initial-splash .play .leap { animation: ssaSplashLeap 0.85s cubic-bezier(0.3, 0.6, 0.3, 1) var(--d) both; }
      #ssa-initial-splash .play .leaph { animation: ssaSplashLeaph 0.95s cubic-bezier(0.3, 0.6, 0.3, 1) var(--d) both; }
      #ssa-initial-splash .play .ring { animation: ssaSplashRing 0.7s ease-out 2.35s both; }
      #ssa-initial-splash .play .sheen { animation: ssaSplashSheen 0.9s ease-in-out 2.7s both; }
      @keyframes ssaSplashPop {
        from { transform: scale(0.22) rotate(-14deg); border-radius: 50%; opacity: 0; }
        25% { opacity: 1; }
        to { transform: none; border-radius: 22.4%; opacity: 1; }
      }
      @keyframes ssaSplashFan {
        from { opacity: 0; transform: rotate(-24deg) scale(0.5); }
        to { opacity: 1; transform: none; }
      }
      @keyframes ssaSplashFan2 {
        from { opacity: 0; transform: scaleX(0.2) scaleY(0.4); }
        to { opacity: 1; transform: none; }
      }
      @keyframes ssaSplashRise {
        from { opacity: 0; clip-path: inset(100% 0 0 0); transform: translateY(32%) scaleY(1.18); }
        20% { opacity: 1; }
        to { opacity: 1; clip-path: inset(-4% -4% -4% -4%); transform: none; }
      }
      @keyframes ssaSplashLeap {
        0% { opacity: 0; transform: translate(calc(var(--size) * -0.06), calc(var(--size) * 0.12)) scale(0.6); }
        25% { opacity: 1; }
        55% { transform: translate(calc(var(--size) * -0.02), calc(var(--size) * -0.1)) scale(1.04); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes ssaSplashLeaph {
        0% { opacity: 0; transform: translate(calc(var(--size) * -0.06), calc(var(--size) * 0.12)) scale(0.6); }
        25% { opacity: 1; }
        50% { transform: translate(calc(var(--size) * -0.01), calc(var(--size) * -0.16)) scale(1.1); }
        75% { transform: translate(0, calc(var(--size) * 0.006)) scale(1.2, 0.8); }
        88% { transform: translate(0, calc(var(--size) * -0.02)) scale(1); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes ssaSplashRing {
        0% { opacity: 0.9; transform: scale(0.4); }
        100% { opacity: 0; transform: scale(4.2); }
      }
      @keyframes ssaSplashSheen {
        to { transform: translateX(120%); }
      }
      #ssa-initial-splash .dots {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
        display: flex;
        gap: 10px;
        align-items: center;
        height: 34px;
      }
      #ssa-initial-splash .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--c);
        animation: ssaSplashHop 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: calc(var(--i) * 0.15s);
      }
      @keyframes ssaSplashHop {
        0%, 55%, 100% { transform: translateY(0); }
        27% { transform: translateY(-15px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ssa-initial-splash .p { opacity: 1 !important; animation: none !important; }
        #ssa-initial-splash .dot, #ssa-initial-splash .play { animation: none !important; }
      }
    </style>
  </head>

    <script>
      (function () {
        var splash = document.getElementById('ssa-initial-splash');
        if (!splash) return;
        var logo = splash.querySelector('.logo');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var start = Date.now();
        var minDuration = reduced ? 300 : 3700;
        var mounted = false;
        var dismissed = false;

        var loopInterval = null;
        if (!reduced && logo) {
          var play = function () {
            if (dismissed) return;
            logo.classList.remove('play', 'out');
            void logo.offsetWidth;
            logo.classList.add('play');
          };
          loopInterval = setInterval(play, 5100);
        }

        function hideSplash() {
          if (dismissed) return;
          dismissed = true;
          if (loopInterval) clearInterval(loopInterval);
          splash.classList.add('splash-done');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 480);
        }

        window.__ssaAppMounted = function () {
          if (mounted) return;
          mounted = true;
          var elapsed = Date.now() - start;
          var remaining = Math.max(0, minDuration - elapsed);
          setTimeout(hideSplash, remaining);
        };

        // Safety fallback in case mount signal is delayed
        setTimeout(hideSplash, 8000);
      })();
    </script>
